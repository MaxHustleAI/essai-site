<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>MALA Studio · piste C, salle obscure</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="/media/hal01-affiche-v1.jpg">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" crossorigin>
  <link rel="stylesheet" href="/maquette/commun.css">
  <style>
    /* Piste C : salle obscure. Un écran vertical dans le noir ; tout le texte se tient en retrait, comme un cartel. */
    body.c { font-family: "Schibsted Grotesk", system-ui, sans-serif; overflow: hidden; }
    .c .ecran { position: fixed; inset: 0; margin: 0; }
    .c .ecran::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 42%), linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 15%); }
    .c header { position: fixed; z-index: 2; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline;
                padding: max(1.1rem, env(safe-area-inset-top)) clamp(1.1rem, 3vw, 2.5rem) 0; }
    .c h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; }
    .c nav { display: flex; gap: clamp(1rem, 2vw, 1.8rem); font-size: .95rem; }
    .c nav a { text-decoration: none; color: var(--brume); }
    .c nav a:hover { color: var(--os); }
    .c .cartel { position: fixed; z-index: 2; left: clamp(1.1rem, 3vw, 2.5rem); right: clamp(1.1rem, 3vw, 2.5rem);
                 bottom: max(1.4rem, calc(env(safe-area-inset-bottom) + .5rem)); display: flex; justify-content: space-between; align-items: flex-end; gap: 1.5rem; }
    .c .phrase { max-width: 30ch; font-size: 1.05rem; line-height: 1.5; }
    .c .film { display: flex; align-items: center; gap: .9rem; flex-shrink: 0; }
    .c .voir { padding: 0; border: 0; background: none; cursor: pointer; text-align: right; line-height: 1.3; }
    .c .voir strong { display: block; font-weight: 600; font-size: 1.05rem; text-decoration: underline; text-underline-offset: .35em; text-decoration-thickness: 1px; }
    .c .voir span { color: var(--brume); font-size: .9rem; }

    @media (min-width: 900px) {
      .c .ecran { left: 50%; right: auto; width: auto; height: 100svh; aspect-ratio: 9 / 16; transform: translateX(-50%); }
      .c .ecran::after { content: none; }
      .c .phrase { max-width: min(30ch, calc((100vw - 100svh * 9 / 16) / 2 - 5rem)); }
    }
  </style>
</head>
<body class="c">
  <figure class="ecran">
    <video class="boucle" src="/media/hal01-boucle-v1.mp4" poster="/media/hal01-affiche-v1.jpg" muted loop playsinline preload="auto" aria-hidden="true"></video>
  </figure>
  <header>
    <h1>MALA Studio</h1>
    <nav aria-label="Main"><a href="#films">Films</a><a href="#studio">Studio</a><a href="#contact">Contact</a><a href="#fr" lang="fr">FR</a></nav>
  </header>
  <main class="cartel">
    <p class="phrase">[Ta phrase : ce qu'une marque peut te confier.]</p>
    <div class="film">
      <button class="pause" type="button" aria-label="Pause the loop"><svg class="i-pause" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.4" height="8"/><rect x="6.1" y="1" width="2.4" height="8"/></svg><svg class="i-lire" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.2 1 L9 5 L2.2 9 Z"/></svg></button>
      <button class="voir" type="button" data-film><strong>Watch HAL01</strong><span>53 s, with sound</span></button>
    </div>
  </main>
  <script type="module" src="/maquette/commun.js"></script>
</body>
</html>
